[project]
name = "inframind-proteus"
description = "Dynamic and statistical model for the 3rd Infodengue-Mosqlimate Dengue Challenge (IMDC)."
#authors = [
#  {name = "Paulo C. Ventura", email = "paulo.pc.vs@gmail.com"},
#    # TODO: Add others
#]
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "mosqlient>=2.1.2",
    "epiweeks>=2.3.0",
    "jupyter>=1.0.0",
    "python-dotenv>=1.0.1",
    "scikit-learn>=1.8.0",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "statsmodels>=0.14.6",
    "scipy>=1.16.3",
    "plotly>=6.0.0",
    #    "pydantic>=2.11.10",
    "matplotlib>=3.9.4",
    "dvc>=3.59",
    "dvc-ssh",
    "numba>=0.63.1",
    "pathos>=0.3.5",
    "pyarrow>=23.0.0",
    # Outbreak-features component (statistical macro-feature models)
    "catboost>=1.2.7",
    "torch>=2.6.0",
    "pandas-stubs>=3.0.5.260730",
]

[project.optional-dependencies]
dev = [
]

[project.scripts]
calibrate-3rd-imdc = "scripts.calibrate_3rd_imdc.main:main"
calc-outbreak-features-from-posteriors = "scripts.calc_outbreak_features_from_posteriors:main"
process-data-for-projections = "scripts.process_data_for_projections:main"
run-outbreak-features = "scripts.run_outbreak_features:main"
project-3rd-imdc = "scripts.project_3rd_imdc:main"


# Pull the CPU-only PyTorch wheel (no CUDA) for the outbreak-features models.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inframind_proteus", "src/scripts"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "nbdime>=4.0.1",
    "salib>=1.5.2",
    "pypdf>=6.4.2",
]


